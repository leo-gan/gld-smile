# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
context:
  version: "0.2.0"

package:
  name: mojo-smile
  version: ${{ version }}

source:
  path: ..

build:
  number: 0
  script:
    - mkdir -p ${{ PREFIX }}/lib/mojo ${{ PREFIX }}/bin
    - mojo precompile -I src src/wire -o ${{ PREFIX }}/lib/mojo/wire.mojoc
    - mojo precompile -I src src/runtime -o ${{ PREFIX }}/lib/mojo/runtime.mojoc
    - mojo precompile -I src src/schema -o ${{ PREFIX }}/lib/mojo/schema.mojoc
    - mojo precompile -I src src/smile -o ${{ PREFIX }}/lib/mojo/smile.mojoc
    - mojo build -I src src/codegen/cli.mojo -o ${{ PREFIX }}/bin/gld-smilegen-mojo

requirements:
  build:
    - mojo-compiler ==1.1.0
  host:
    - mojo-compiler ==1.1.0
  run:
    - ${{ pin_compatible('mojo-compiler') }}

tests:
  - script:
      - if: unix
        then:
          - mojo run test_import.mojo
          - gld-smilegen-mojo --help
    files:
      recipe:
        - test_import.mojo

about:
  homepage: https://leo-gan.github.io/gld-smile/
  repository: https://github.com/leo-gan/gld-smile
  documentation: https://leo-gan.github.io/gld-smile/
  license: MIT
  license_file: LICENSE
  summary: From-scratch Smile 1.0.7 library for Mojo
  description: |
    Runtime and code generator written in Mojo. Does not wrap a C, C++, or
    Rust Smile library. The package installs smile.mojoc (plus wire, runtime,
    and schema) and the gld-smilegen-mojo CLI.
